name: quicksend
description: Cross-platform AirDrop-like file transfer between iPhone and Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Discovery
  nsd: 4.0.4
  flutter_blue_plus: ^1.32.0
  # File picking
  file_picker: ^8.0.0
  # HTTP for transfers
  http: ^1.2.0
  # State management (simple start)
  provider: ^6.1.0
  # Permissions
  permission_handler: ^11.0.0
  # File system paths
  path_provider: ^2.1.0
  # QR codes for share links
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
